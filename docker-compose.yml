services:
  redis:
    image: redis:alpine
    container_name: t_invest_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: t_invest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: t_invest_db
      POSTGRES_USER: t_invest_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-t_invest_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t_invest_user -d t_invest_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: t_invest_backend
    restart: unless-stopped
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --chdir /app/backend --bind 0.0.0.0:8000 --workers 4 --threads 2 --backlog 2048 --access-logfile - --error-logfile -"
    volumes:
      - ./backend:/app/backend
      - staticfiles_volume:/app/backend/staticfiles
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgres://t_invest_user:${POSTGRES_PASSWORD:-t_invest_secret}@postgres:5432/t_invest_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: t_invest_worker
    restart: unless-stopped
    command: celery --workdir backend -A config worker --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgres://t_invest_user:${POSTGRES_PASSWORD:-t_invest_secret}@postgres:5432/t_invest_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started

  celery_beat:
    build: .
    container_name: t_invest_beat
    restart: unless-stopped
    command: celery --workdir backend -A config beat --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgres://t_invest_user:${POSTGRES_PASSWORD:-t_invest_secret}@postgres:5432/t_invest_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: t_invest_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_volume:/app/backend/staticfiles:ro
    depends_on:
      - backend

  bot:
    build: .
    container_name: t_invest_bot
    restart: unless-stopped
    network_mode: "host"
    command: python -m bot.main
    volumes:
      - ./bot:/app/bot
      - ./.env:/app/.env
    environment:
      - BACKEND_URL=http://127.0.0.1:8000
    env_file:
      - .env
    depends_on:
      - backend
      - nginx

volumes:
  staticfiles_volume:
  postgres_data:
