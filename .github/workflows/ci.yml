name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check backend/apps/

      - name: Run Django Test Suite
        env:
          ENCRYPTION_KEY: "01234567890123456789012345678901="
        run: uv run python backend/manage.py test users portfolio analytics

  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dummy .env file for validation
        run: |
          echo "BOT_TOKEN=test_token" > .env
          echo "ENCRYPTION_KEY=01234567890123456789012345678901=" >> .env
          echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
          echo "CELERY_RESULT_BACKEND=redis://redis:6379/0" >> .env

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Docker Services
        run: docker compose build backend nginx
