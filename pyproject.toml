[project]
name = "t-invest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleg Irshko", email = "irshko@sfedu.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0.11",
    "aiogram>=3.31.0",
    "aiohttp>=3.14.3",
    "aiohttp-socks>=0.12.0",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "environs>=15.2.0",
    "google-genai>=2.25.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "socksio>=1.0.0",
    "t-tech-investments>=1.49.3",
]

[project.scripts]
t-invest = "t_invest:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[tool.uv]
allow-insecure-host = ["opensource.tbank.ru"]

